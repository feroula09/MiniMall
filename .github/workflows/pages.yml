name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "public/seed/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # 介紹頁沿用網站的 seed 商品圖
      - run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r public/seed _site/seed
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
